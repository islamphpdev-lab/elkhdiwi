/* ==========================================================
   بن الخديوي — Store styles (RTL, mobile-first)
   ========================================================== */
:root {
  --c-950: #140c07;
  --c-900: #1e130c;
  --c-800: #2b1a10;
  --c-700: #3b2416;
  --c-600: #5a3a24;
  --c-500: #7a5236;
  --gold: #c9a24a;
  --gold-2: #e3c578;
  --gold-3: #f3e2b0;
  --gold-dark: #9a7425;
  --cream: #f8f2e8;
  --beige: #efe3cf;
  --beige-2: #e4d2b4;
  --ink: #2a1d14;
  --muted: #7b6857;
  --line: #e6d8c2;
  --ok: #2f7d4f;
  --warn: #b7791f;
  --err: #b3261e;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 10px 30px -12px rgba(43, 26, 16, .28);
  --shadow-sm: 0 4px 14px -6px rgba(43, 26, 16, .22);
  --font: 'Tajawal', 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  --font-display: 'Amiri', 'Tajawal', serif;
  --container: 1200px;
  --header-h: 72px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.7; color: var(--ink);
  background: var(--cream); direction: rtl; text-align: right; -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { line-height: 1.3; margin: 0 0 .5em; color: var(--c-800); }
h1, h2 { font-family: var(--font-display); font-weight: 700; }
p { margin: 0 0 1em; }
.container { width: min(100% - 32px, var(--container)); margin-inline: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.skip-link { position: absolute; top: -50px; right: 12px; background: var(--gold); color: var(--c-900); padding: 8px 14px; border-radius: 8px; z-index: 100; }
.skip-link:focus { top: 12px; }

/* ---------------- announcement + header ---------------- */
.announce { background: linear-gradient(90deg, var(--c-900), var(--c-700), var(--c-900)); color: var(--gold-3); font-size: 14px; text-align: center; padding: 7px 12px; }
.header { position: sticky; top: 0; z-index: 40; background: rgba(30, 19, 12, .96); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(201, 162, 74, .25); }
.header .container { display: flex; align-items: center; gap: 18px; height: var(--header-h); }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; flex-shrink: 0; }
.brand img { width: 46px; height: 46px; }
.brand-name { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; background: linear-gradient(180deg, var(--gold-3), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-sub { display: block; font-size: 10px; letter-spacing: 3px; color: var(--gold); font-family: Georgia, serif; margin-top: 3px; direction: ltr; text-align: right; }
.nav { display: none; gap: 4px; margin-inline-start: 12px; }
.nav a { color: #eadcc6; padding: 8px 12px; border-radius: 8px; font-weight: 500; font-size: 15px; transition: .2s; }
.nav a:hover, .nav a.active { color: var(--gold-2); background: rgba(201, 162, 74, .12); }
.header-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: #f0e3cc; cursor: pointer; transition: .2s; }
.icon-btn:hover { background: rgba(201, 162, 74, .15); color: var(--gold-2); }
.icon-btn svg { width: 22px; height: 22px; }
.badge { position: absolute; top: 2px; left: 2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--gold); color: var(--c-900); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.badge[data-count="0"] { display: none; }
.menu-btn { display: inline-grid; }
@media (min-width: 1000px) { .nav { display: flex; } .menu-btn { display: none; } }

.search-bar { display: none; background: var(--c-800); padding: 12px 0; border-bottom: 1px solid rgba(201,162,74,.2); }
.search-bar.open { display: block; }
.search-bar form { display: flex; gap: 8px; }
.search-bar input { flex: 1; }

/* drawer */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: .25s; z-index: 60; }
.drawer { position: fixed; top: 0; bottom: 0; right: 0; width: min(320px, 86vw); background: var(--c-900); color: #f0e3cc; transform: translateX(100%); transition: .3s; z-index: 61; padding: 20px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.drawer a { padding: 12px 14px; border-radius: 10px; font-size: 17px; }
.drawer a:hover, .drawer a.active { background: rgba(201,162,74,.15); color: var(--gold-2); }
body.drawer-open .drawer { transform: none; }
body.drawer-open .drawer-backdrop { opacity: 1; pointer-events: auto; }

/* ---------------- buttons & forms ---------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 700; cursor: pointer; transition: .2s; font-size: 16px; line-height: 1.2; white-space: nowrap; }
.btn svg { width: 20px; height: 20px; }
.btn-gold { background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, var(--gold-dark)); color: var(--c-900); box-shadow: 0 8px 20px -10px rgba(201,162,74,.8); }
.btn-gold:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn-dark { background: var(--c-800); color: var(--gold-3); }
.btn-dark:hover { background: var(--c-700); }
.btn-outline { border-color: var(--c-700); color: var(--c-700); background: transparent; }
.btn-outline:hover { background: var(--c-700); color: var(--cream); }
.btn-ghost-light { border-color: rgba(243,226,176,.5); color: var(--gold-3); background: transparent; }
.btn-ghost-light:hover { background: rgba(243,226,176,.1); }
.btn-wa { background: #1fa855; color: #fff; }
.btn-wa:hover { background: #178a45; }
.btn-sm { padding: 8px 14px; font-size: 14px; }
.btn-block { width: 100%; }
.btn[disabled], .btn.loading { opacity: .6; pointer-events: none; }
.btn.loading::after { content: ''; width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.link { color: var(--c-600); font-weight: 700; border-bottom: 1px dashed var(--gold); }
.link-btn { background: none; border: 0; padding: 0; color: var(--err); cursor: pointer; font-size: 14px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-weight: 700; font-size: 14px; color: var(--c-700); }
.field .hint { font-size: 13px; color: var(--muted); }
.field .err { font-size: 13px; color: var(--err); min-height: 0; }
.input, select.input, textarea.input {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: #fff; transition: .2s; min-height: 48px;
}
.input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(201,162,74,.18); }
.input.invalid { border-color: var(--err); }
textarea.input { min-height: 110px; resize: vertical; }
.input[dir="ltr"] { text-align: right; }
.grid-2 { display: grid; gap: 0 16px; }
@media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--c-700); margin-top: 4px; flex-shrink: 0; }

/* option pills */
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { position: relative; }
.pill input { position: absolute; opacity: 0; pointer-events: none; }
.pill span { display: inline-flex; flex-direction: column; align-items: center; min-width: 74px; padding: 9px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; font-weight: 700; transition: .15s; font-size: 15px; }
.pill span small { font-weight: 500; color: var(--muted); font-size: 12px; }
.pill input:checked + span { border-color: var(--c-700); background: var(--c-800); color: var(--gold-3); }
.pill input:checked + span small { color: var(--gold-2); }
.pill input:focus-visible + span { outline: 3px solid var(--gold); }
.pill input:disabled + span { opacity: .45; cursor: not-allowed; text-decoration: line-through; }

.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; overflow: hidden; }
.qty button { width: 40px; height: 42px; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: var(--c-700); }
.qty button:hover { background: var(--beige); }
.qty input { width: 44px; text-align: center; border: 0; font-weight: 800; background: transparent; -moz-appearance: textfield; }
.qty input::-webkit-inner-spin-button { -webkit-appearance: none; }
.qty.sm button { width: 32px; height: 34px; font-size: 17px; }
.qty.sm input { width: 34px; }

/* ---------------- hero ---------------- */
.hero { position: relative; overflow: hidden; color: var(--cream); background:
  radial-gradient(1200px 500px at 15% 20%, rgba(201,162,74,.18), transparent 60%),
  radial-gradient(800px 400px at 90% 100%, rgba(122,82,54,.5), transparent 60%),
  linear-gradient(135deg, var(--c-950), var(--c-800) 60%, var(--c-700)); }
.hero::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(243,226,176,.07) 1px, transparent 1px); background-size: 22px 22px; }
.hero .container { position: relative; display: grid; gap: 30px; padding: 56px 0 64px; align-items: center; }
@media (min-width: 900px) { .hero .container { grid-template-columns: 1.1fr .9fr; padding: 84px 0; } }
.eyebrow { display: inline-flex; gap: 8px; align-items: center; color: var(--gold-2); font-weight: 700; letter-spacing: .5px; font-size: 15px; }
.eyebrow::before { content: ''; width: 34px; height: 2px; background: var(--gold); }
.hero h1 { color: #fff; font-size: clamp(36px, 6vw, 64px); margin: 12px 0 16px; }
.hero h1 em { font-style: normal; background: linear-gradient(180deg, var(--gold-3), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p.lead { font-size: 18px; color: #e6d6bd; max-width: 560px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.hero-stats { display: flex; gap: 28px; margin-top: 34px; flex-wrap: wrap; }
.hero-stats b { display: block; font-size: 26px; color: var(--gold-2); font-family: var(--font-display); }
.hero-stats span { font-size: 14px; color: #cdbb9f; }
.hero-art { position: relative; display: grid; place-items: center; }
.hero-art .ring { position: absolute; width: 88%; aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(201,162,74,.35); }
.hero-art .ring.r2 { width: 70%; border-style: dashed; animation: spin 60s linear infinite; }
.hero-art img { position: relative; width: min(420px, 80%); filter: drop-shadow(0 30px 40px rgba(0,0,0,.5)); border-radius: 26px; }

/* ---------------- sections ---------------- */
.section { padding: 64px 0; }
.section.alt { background: var(--beige); }
.section.dark { background: linear-gradient(160deg, var(--c-900), var(--c-700)); color: var(--cream); }
.section.dark h2, .section.dark h3 { color: var(--gold-3); }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
.section-head h2 { font-size: clamp(28px, 4vw, 40px); margin: 0; }
.section-head p { color: var(--muted); margin: 6px 0 0; }
.ornament { display: block; width: 90px; height: 10px; margin-top: 8px; background:
  linear-gradient(var(--gold), var(--gold)) center/100% 1px no-repeat,
  radial-gradient(circle, var(--gold) 3px, transparent 3.5px) center/10px 10px no-repeat; }
.page-hero { background: linear-gradient(135deg, var(--c-900), var(--c-700)); color: var(--cream); padding: 44px 0 40px; }
.page-hero h1 { color: #fff; font-size: clamp(30px, 5vw, 46px); margin: 6px 0 4px; }
.page-hero p { color: #d9c7aa; margin: 0; }
.crumbs { font-size: 14px; color: #bda98a; }
.crumbs a:hover { color: var(--gold-2); }

/* categories */
.cat-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.cat-card { position: relative; padding: 22px 18px; border-radius: var(--radius); background: #fff; border: 1px solid var(--line); transition: .25s; overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-height: 150px; }
.cat-card::after { content: ''; position: absolute; left: -30px; bottom: -30px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(201,162,74,.25), transparent 70%); }
.cat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--gold); }
.cat-card .ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--c-800); color: var(--gold-2); }
.cat-card .ico svg { width: 26px; height: 26px; }
.cat-card h3 { margin: 6px 0 0; font-size: 19px; }
.cat-card p { font-size: 13px; color: var(--muted); margin: 0; }
.cat-card .count { font-size: 13px; color: var(--gold-dark); font-weight: 700; margin-top: auto; }
.cat-list { display: grid; gap: 20px; }
@media (min-width: 760px) { .cat-list { grid-template-columns: 1fr 1fr; } }
.cat-row { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; background: #fff; border-radius: var(--radius); padding: 16px; border: 1px solid var(--line); transition: .25s; }
.cat-row:hover { box-shadow: var(--shadow); border-color: var(--gold); }
.cat-row img { border-radius: 12px; aspect-ratio: 1; object-fit: cover; background: var(--beige); }

/* products */
.product-grid { display: grid; gap: 18px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 720px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1100px) { .product-grid.cols-4 { grid-template-columns: repeat(4, 1fr); } }
.card { position: relative; background: #fff; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); display: flex; flex-direction: column; transition: .25s; }
.card:hover { box-shadow: var(--shadow); transform: translateY(-3px); }
.card-media { position: relative; aspect-ratio: 1; background: var(--beige); overflow: hidden; }
.card-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.card:hover .card-media img { transform: scale(1.05); }
.tag { position: absolute; top: 10px; right: 10px; background: var(--err); color: #fff; font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 999px; }
.tag.gold { background: var(--gold); color: var(--c-900); }
.tag.out { background: #555; }
.tag + .tag { top: 42px; }
.card-body { padding: 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card-cat { font-size: 12px; color: var(--gold-dark); font-weight: 700; }
.card-title { font-size: 17px; font-weight: 800; color: var(--c-800); margin: 0; line-height: 1.4; }
.card-notes { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; }
.price { font-weight: 800; color: var(--c-700); font-size: 18px; white-space: nowrap; }

    [/^\/products\/?$/, viewProducts],
    [/^\/categories\/?$/, viewCategories],
    [/^\/product\/([^/]+)\/?$/, viewProduct],
    [/^\/offers\/?$/, viewOffers],
    [/^\/about\/?$/, viewAbout],
    [/^\/contact\/?$/, viewContact],
    [/^\/cart\/?$/, viewCart],
    [/^\/checkout\/?$/, viewCheckout],
    [/^\/order-success\/?$/, viewOrderSuccess],
    [/^\/account\/?$/, viewAccount],
    [/^\/track\/?$/, viewTrack],
    [/^\/policies\/(privacy|terms|shipping)\/?$/, viewPolicy],
  ];

  let navToken = 0;
  async function render() {
    const token = ++navToken;
    const { pathname, searchParams } = curUrl();
    const match = routes.find(([re]) => re.test(pathname));
    document.body.classList.remove('drawer-open');
    $('#searchBar').classList.remove('open');
    $$('.nav a, .drawer a').forEach((a) => a.classList.toggle('active', a.getAttribute('href') === pathname || (pathname.startsWith('/product') && a.getAttribute('href') === '/products')));
    try {
      if (!match) return viewNotFound();
      const params = pathname.match(match[0]).slice(1).map(decodeURIComponent);
      await match[1](params, searchParams, () => token === navToken);
    } catch (e) {
      console.error(e);
      if (token === navToken) app.innerHTML = `<div class="container page"><div class="empty">${ICONS.cup}<h2>تعذّر تحميل الصفحة</h2><p>${esc(e.message)}</p><button class="btn btn-dark" data-reload>إعادة المحاولة</button></div></div>`;
    }
    if (window.gtag && state.boot?.settings.ga_measurement_id) window.gtag('event', 'page_view', { page_path: pathname + location.search, page_title: document.title });
    if (window.fbq) window.fbq('track', 'PageView');
  }
  function navigate(href, { replace = false, keepScroll = false } = {}) {
    if (replace) history.replaceState({}, '', '#' + href); else history.pushState({}, '', '#' + href);
    render().then(() => { if (!keepScroll) window.scrollTo({ top: 0, behavior: 'instant' }); app.focus({ preventScroll: true }); });
  }
  function setTitle(t) { document.title = t ? `${t} | ${state.boot.settings.company_name}` : `${state.boot.settings.company_name} | ${state.boot.settings.tagline}`; }
  function setMeta(desc) { const m = $('meta[name="description"]'); if (m && desc) m.setAttribute('content', desc); }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="/"]');
    if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
      e.preventDefault();
      const href = a.getAttribute('href'); const c = curUrl();
      if (href !== c.pathname + c.search) navigate(href);
      else document.body.classList.remove('drawer-open');
      return;
    }
    if (e.target.closest('[data-reload]')) render();
  });
  window.addEventListener('popstate', () => render());

  /* ------------------------------ shared UI ------------------------------ */
  const imgOf = (p) => esc(p.image || EMBLEM);
  function productCard(p) {
    const v0 = p.variants.find((v) => v.stock > 0) || p.variants[0];
    const minVar = p.variants.reduce((a, b) => (b.effective_price < (a?.effective_price ?? Infinity) ? b : a), null);
    const tags = [];
    if (p.on_sale) tags.push(`<span class="tag">خصم ${p.max_discount}%</span>`);
    else if (p.featured) tags.push('<span class="tag gold">الأكثر طلباً</span>');
    if (!p.in_stock) tags.push('<span class="tag out">نفد المخزون</span>');
    return `<article class="card">
      <a href="/product/${encodeURIComponent(p.slug)}" class="card-media" aria-label="${esc(p.name)}">
        <img src="${imgOf(p)}" alt="${esc(p.name)}" loading="lazy" width="600" height="600">${tags.join('')}

      <div class="card-body">
        <span class="card-cat">${esc(p.category_name || p.coffee_type)}</span>

          <div class="price">${minVar ? `<small>يبدأ من</small> ${fmt(minVar.effective_price)}${minVar.sale_price != null ? `<del>${fmt(minVar.price)}</del>` : ''}` : '—'}</div>
          ${p.in_stock && v0 ? `<button class="btn btn-dark btn-sm" data-quick-add="${v0.id}" data-p="${esc(p.slug)}" data-roast="${esc(p.roast_options[0] || '')}" data-grind="${esc(p.grind_options[0] || '')}" data-price="${v0.effective_price}" data-name="${esc(p.name)}">أضف للسلة</button>` : `<a class="btn btn-outline btn-sm" href="/product/${encodeURIComponent(p.slug)}">التفاصيل</a>`}

    track('add_to_cart', { value: Number(b.dataset.price), currency: 'EGP', items: [{ item_name: b.dataset.name }] });

  function fieldErrors(form, fields = {}) {
    $$('.err', form).forEach((e) => (e.textContent = ''));
    $$('.invalid', form).forEach((e) => e.classList.remove('invalid'));
    let first;
    for (const [k, msg] of Object.entries(fields || {})) {
      const input = form.elements[k];
      const box = $(`[data-err="${k}"]`, form);
      if (box) box.textContent = msg;
      if (input && input.classList) { input.classList.add('invalid'); first ||= input; }
    }
    first?.focus();
  }
  const field = (name, label, { type = 'text', required = false, value = '', placeholder = '', hint = '', attrs = '', textarea = false } = {}) => `
    <div class="field"><label for="f-${name}">${label}${required ? ' <span aria-hidden="true" style="color:var(--err)">*</span>' : ''}</label>
      ${textarea ? `<textarea class="input" id="f-${name}" name="${name}" ${required ? 'required' : ''} placeholder="${esc(placeholder)}" ${attrs}>${esc(value)}</textarea>`
      : `<input class="input" id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required ? 'required' : ''} placeholder="${esc(placeholder)}" ${attrs}>`}
      ${hint ? `<span class="hint">${hint}</span>` : ''}<span class="err" data-err="${name}"></span></div>`;
  const formData = (form) => Object.fromEntries(new FormData(form).entries());
  async function submitWith(btn, fn) {
    btn.classList.add('loading');
    try { return await fn(); } finally { btn.classList.remove('loading'); }
  }

    <h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div></section>`;

      <div class="container" style="padding-bottom:30px"><h2 style="font-family:var(--font);font-weight:800;font-size:22px">وصف المنتج</h2><div class="desc">${esc(p.description)}</div></div>
      ${p.related.length ? `<section class="section alt"><div class="container"><div class="section-head"><div><h2>قد يعجبك أيضاً</h2><span class="ornament"></span></div></div><div class="product-grid cols-4">${p.related.map(productCard).join('')}</div></div></section>` : ''}`;

    const form = $('#buyForm');
    const current = () => {
      const d = formData(form);
      const v = p.variants.find((x) => x.id === Number(d.variant));
      const blend = d.blend || 'سادة';
      const extra = blend === 'محوج' && v ? Math.round((p.mohawag_extra_per_kg * v.grams) / 1000) : 0;
      return { v, roast: d.roast || '', grind: d.grind || '', blend, qty: Math.max(1, Math.min(50, Number(d.qty) || 1)), unit: v ? v.effective_price + extra : 0, orig: v ? v.price + extra : 0 };
    };
    const refresh = () => {
      const c = current();
      if (!c.v) { $('#price').textContent = 'غير متاح حالياً'; $('#addBtn').disabled = $('#buyNow').disabled = true; return; }
      $('#price').innerHTML = `${fmt(c.unit * c.qty)}${c.v.sale_price != null ? `<del>${fmt(c.orig * c.qty)}</del>` : ''} <small>${c.qty > 1 ? `(${c.qty} × ${fmt(c.unit)})` : ''}</small>`;
      const note = $('#stockNote');
      note.className = 'stock-note' + (c.v.stock <= 0 ? ' out' : c.v.stock <= 5 ? ' low' : '');
      note.textContent = c.v.stock <= 0 ? 'نفد هذا الوزن' : c.v.stock <= 5 ? `متبقي ${c.v.stock} فقط — اطلب الآن` : 'متوفر ✓';
      $('#addBtn').disabled = $('#buyNow').disabled = c.v.stock <= 0;
      const text = `مرحباً ${s.company_name}، أريد طلب:\n${p.name} - ${c.v.weight_label}${c.roast ? ' - ' + c.roast : ''}${c.grind ? ' - ' + c.grind : ''}${c.blend === 'محوج' ? ' - محوج' : ''}\nالكمية: ${c.qty}`;
      $('#waOrder').href = `https://wa.me/${String(s.whatsapp).replace(/\D/g, '')}?text=${encodeURIComponent(text)}`;
    };
    form.addEventListener('change', refresh);
    form.addEventListener('input', refresh);
    $$('[data-step]', form).forEach((b) => b.addEventListener('click', () => { const i = form.qty; i.value = Math.max(1, Math.min(50, Number(i.value) + Number(b.dataset.step))); refresh(); }));
    const add = () => {
      const c = current();
      if (!c.v || c.v.stock <= 0) return false;
      cart.add({ variant_id: c.v.id, slug: p.slug, qty: c.qty, roast: c.roast, grind: c.grind, blend: c.blend });
      track('add_to_cart', { value: c.unit * c.qty, currency: 'EGP', items: [{ item_name: p.name, item_variant: c.v.weight_label, quantity: c.qty }] });
      return true;
    };
    form.addEventListener('submit', (e) => { e.preventDefault(); if (add()) toast(`تمت إضافة «${p.name}» إلى السلة`, { link: { href: '/cart', text: 'عرض السلة' } }); });
    $('#buyNow').addEventListener('click', () => { if (add()) navigate('/checkout'); });
    refresh();
  }

  /* ---------- cart ---------- */
  function quoteBody(extra = {}) {
    return { items: cart.read().map(({ variant_id, qty, roast, grind, blend }) => ({ variant_id, qty, roast, grind, blend })), coupon_code: getCoupon() || undefined, ...extra };
  }
  function summaryHtml(q, { showCoupon = true } = {}) {
    const pct = q.free_shipping_threshold ? Math.min(100, ((q.subtotal - q.discount) / q.free_shipping_threshold) * 100) : 0;
    return `
      ${q.free_shipping_threshold && q.lines.length ? `<div class="free-ship">${q.free_shipping ? '🎉 طلبك مؤهل للشحن المجاني' : `أضف ${fmt(q.remaining_for_free_shipping)} لتحصل على شحن مجاني`}<div class="bar"><i style="width:${pct}%"></i></div></div>` : ''}
      ${showCoupon ? `<div class="coupon-row"><input class="input" id="couponInput" placeholder="كود الخصم" value="${esc(getCoupon())}" aria-label="كود الخصم" dir="ltr"><button type="button" class="btn btn-outline btn-sm" id="couponApply">${getCoupon() ? 'تحديث' : 'تطبيق'}</button></div>
        ${q.coupon ? `<p class="alert alert-ok" style="margin:8px 0">تم تطبيق ${esc(q.coupon.code)}: ${esc(q.coupon.description)} <button type="button" class="link-btn" id="rmCoupon">إزالة</button></p>` : ''}
        ${q.coupon_error ? `<p class="alert alert-err" style="margin:8px 0">${esc(q.coupon_error)}</p>` : ''}` : ''}
      <div style="margin-top:12px">
        <div class="summary-row"><span>المجموع الفرعي</span><b>${fmt(q.subtotal)}</b></div>
        ${q.discount ? `<div class="summary-row discount"><span>الخصم</span><b>− ${fmt(q.discount)}</b></div>` : ''}
        <div class="summary-row"><span>الشحن ${q.zone ? `(${esc(q.zone.governorate)})` : ''}</span><b>${q.free_shipping ? 'مجاني' : q.zone ? fmt(q.shipping) : 'يُحسب حسب المحافظة'}</b></div>
        <div class="summary-row total"><span>الإجمالي</span><span>${fmt(q.total)}</span></div>
      </div>`;
  }
  function bindCoupon(rerender) {
    const apply = () => { setCoupon($('#couponInput').value.trim().toUpperCase()); rerender(); };
    $('#couponApply')?.addEventListener('click', apply);
    $('#couponInput')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); apply(); } });
    $('#rmCoupon')?.addEventListener('click', () => { setCoupon(''); rerender(); });
  }

      const missing = {};
      for (const k of ['name', 'phone', 'governorate', 'area', 'address']) if (!String(d[k] || '').trim()) missing[k] = 'هذا الحقل مطلوب';
      if (d.payment_method === 'wallet' && !String(d.payment_ref || '').trim()) missing.payment_ref = 'اكتب رقم عملية التحويل';
      if (!d.agree) missing.agree = 'يجب الموافقة على الشروط لإتمام الطلب';
      if (Object.keys(missing).length) { fieldErrors(form, missing); return toast('أكمل البيانات المطلوبة', { error: true }); }
      const body = { ...quoteBody(), name: d.name, phone: d.phone, whatsapp: d.whatsapp || undefined, email: d.email || undefined, governorate: d.governorate, area: d.area,
        address: d.address, notes: d.notes, payment_method: d.payment_method, payment_ref: d.payment_ref || undefined, save_address: !!d.save_address, marketing_opt_in: !!d.marketing_opt_in };
      try {
        const r = await submitWith($('#placeOrder'), () => api('/api/orders', { method: 'POST', body }));
        track('purchase', { transaction_id: r.order.order_number, value: r.order.total, currency: 'EGP', shipping: r.order.shipping });
        cart.clear(); setCoupon(''); sessionStorage.removeItem('kh_checkout');
        sessionStorage.setItem('kh_last_order', JSON.stringify(r));
        if (r.payment_url) { location.href = r.payment_url; return; }
        navigate(`/order-success?order=${encodeURIComponent(r.order.order_number)}`, { replace: true });
      } catch (err) {
        fieldErrors(form, err.fields);
        toast(err.message, { error: true });
        if (err.status === 409) refreshSummary();
      }
    });
  }

        <p style="margin-top:14px;color:var(--muted)">تأكد من إرسال رسالة الطلب على واتساب. إن لم يفتح واتساب تلقائياً اضغط الزر بالأسفل. نؤكد الطلب فور وصول رسالتك.</p></div>
      ${o ? `<div class="panel"><h2>تفاصيل الطلب</h2>

        <p><b>التوصيل إلى:</b> ${esc(o.governorate)}، ${esc(o.area)} — ${esc(o.address)}</p></div>` : ''}
      <div class="buy-row" style="justify-content:center">
        ${r?.whatsapp_link && o ? `<a class="btn btn-wa" href="${esc(r.whatsapp_link)}" target="_blank" rel="noopener">${ICONS.wa} إرسال الطلب على واتساب</a>` : ''}
        <a class="btn btn-dark" href="/track?order=${encodeURIComponent(number)}">تتبع الطلب</a>
        <a class="btn btn-outline" href="/products">متابعة التسوق</a>

  /* ---------- my orders (this device) ---------- */
  async function viewAccount() {

  /* ---------- tracking ---------- */
  async function viewTrack(_, sp) {
    setTitle('تتبع الطلب'); const _wa = `https://wa.me/${String(state.boot.settings.whatsapp).replace(/\D/g, '')}`;
    const number = sp.get('order') || ''; const phone = sp.get('phone') || LocalStore.savedCustomer()?.phone || '';
    app.innerHTML = `${pageHero('تتبع الطلب', 'اكتب رقم الطلب ورقم الموبايل المستخدم في الطلب')}
      <div class="container page narrow">
        <form class="panel" id="trackForm" novalidate>
          ${field('number', 'رقم الطلب', { required: true, value: number, placeholder: 'KH-261122-1234', attrs: 'dir="ltr"' })}
          ${field('phone', 'رقم الموبايل', { type: 'tel', required: true, value: phone, attrs: 'dir="ltr" inputmode="tel"' })}
          <button class="btn btn-gold btn-block">تتبع</button>
        </form>
        <div id="trackResult"></div><a class="btn btn-wa btn-block" style="margin-top:16px" target="_blank" rel="noopener" href="${_wa}?text=${encodeURIComponent('أستفسر عن حالة طلبي رقم: ' + number)}">${ICONS.wa} استفسر عن حالة طلبك على واتساب</a></div>`;
    const form = $('#trackForm');
    const run = async () => {
      const d = formData(form);
      try {
        const o = await submitWith($('button', form), () => api(`/api/orders/track?${new URLSearchParams({ number: d.number.trim(), phone: d.phone })}`));
        fieldErrors(form); $('#trackResult').innerHTML = trackHtml(o);
      } catch (err) { fieldErrors(form, err.fields); $('#trackResult').innerHTML = `<p class="alert alert-err" style="margin-top:16px">${esc(err.message)}</p>`; }
    };
    form.addEventListener('submit', (e) => { e.preventDefault(); run(); });
    if (number && phone) run();
  }
  function trackHtml(o) {
    const flow = ['new', 'confirmed', 'preparing', 'shipped', 'delivered'];
    const labels = { new: 'تم استلام الطلب', confirmed: 'تم تأكيد الطلب', preparing: 'جاري التحميص والتعبئة', shipped: 'في الطريق إليك', delivered: 'تم التسليم' };
    const at = (s) => o.history.filter((h) => h.status === s).pop();
    const bad = ['cancelled', 'returned'].includes(o.status);
    const idx = flow.indexOf(o.status);
    return `<div class="panel" style="margin-top:18px">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><h2 style="margin:0" dir="ltr">${esc(o.order_number)}</h2><span class="status ${o.status}">${esc(o.status_label)}</span></div>
      <ul class="timeline">${bad ? `${flow.filter((s) => at(s)).map((s) => `<li class="done"><b>${labels[s]}</b><small>${fmtDate(at(s).created_at)}</small></li>`).join('')}<li class="bad current"><b>${esc(o.status_label)}</b><small>${esc(at(o.status)?.note || '')}</small></li>`
        : flow.map((s, i) => `<li class="${i <= idx ? 'done' : ''} ${i === idx ? 'current' : ''}"><b>${labels[s]}</b>${at(s) ? `<small>${fmtDate(at(s).created_at)}</small>` : ''}</li>`).join('')}</ul>
      ${o.items.map((i) => `<div class="mini-line"><div>${esc(i.product_name)} × ${i.qty}<small>${esc([i.weight_label, i.roast, i.grind, i.blend].filter(Boolean).join(' • '))}</small></div><b>${fmt(i.line_total)}</b></div>`).join('')}
      <div class="summary-row total"><span>الإجمالي</span><span>${fmt(o.total)}</span></div>
      <p style="font-size:14px;color:var(--muted)">الدفع: ${esc(o.payment_label)} (${esc(o.payment_status_label)}) • التوصيل: ${esc(o.governorate)}</p></div>`;
  }

        <h2>الدفع</h2><ul><li>الدفع عند الاستلام متاح لجميع المحافظات.</li><li>في حالة الدفع بالمحفظة يتم تأكيد الطلب بعد مراجعة التحويل.</li><li>الدفع بالبطاقات يتم عبر بوابة دفع معتمدة وآمنة.</li></ul>
        <h2>أكواد الخصم</h2><p>لا يمكن الجمع بين أكثر من كود خصم في الطلب الواحد، ولكل كود شروطه وتاريخ صلاحيته.</p>
        <h2>الملكية الفكرية</h2><p>جميع المحتويات والشعار والعلامة التجارية «بن الخديوي» مملوكة للشركة ولا يجوز استخدامها دون إذن.</p>`],
      shipping: ['سياسة الشحن والاسترجاع', `
        <h2>الشحن والتوصيل</h2><ul><li>نوصّل لجميع محافظات مصر خلال 1 إلى 5 أيام عمل حسب المحافظة.</li><li>تُحسب مصاريف الشحن حسب المحافظة وتظهر قبل تأكيد الطلب.</li><li>الشحن مجاني للطلبات التي تتجاوز ${fmt(s.free_shipping_threshold)}.</li><li>يمكنك متابعة حالة طلبك في أي وقت من صفحة <a class="link" href="/track">تتبع الطلب</a>.</li></ul>
        <h2>الاستبدال والاسترجاع</h2><ul><li>نظراً لطبيعة البن كمنتج غذائي يُطحن حسب الطلب، يُقبل الاسترجاع فقط في حالة وجود عيب في المنتج أو خطأ في الطلب.</li><li>يجب إبلاغنا خلال 48 ساعة من الاستلام مع صورة للمنتج، ويكون الكيس مغلقاً بحالته الأصلية.</li><li>نتحمّل مصاريف الشحن في حالة الخطأ من جانبنا، ويتم الاستبدال أو رد المبلغ خلال 7 أيام عمل.</li></ul>

  function viewNotFound(msg = 'الصفحة غير موجودة') {

        <p>${esc(s.tagline)}. بن طازج محمّص بعناية ومطحون حسب ذوقك، يصلك لباب البيت في كل محافظات مصر.</p>
        <div class="socials">${s.facebook ? `<a href="${esc(s.facebook)}" target="_blank" rel="noopener" aria-label="فيسبوك">${ICONS.fb}</a>` : ''}${s.instagram ? `<a href="${esc(s.instagram)}" target="_blank" rel="noopener" aria-label="إنستجرام">${ICONS.ig}</a>` : ''}${s.tiktok ? `<a href="${esc(s.tiktok)}" target="_blank" rel="noopener" aria-label="تيك توك">${ICONS.tt}</a>` : ''}<a href="https://wa.me/${esc(String(s.whatsapp).replace(/\D/g, ''))}" target="_blank" rel="noopener" aria-label="واتساب">${ICONS.wa}</a></div></div>
      <div><h4>تسوّق</h4><ul><li><a href="/products">جميع المنتجات</a></li>${state.boot.categories.slice(0, 5).map((c) => `<li><a href="/products?category=${encodeURIComponent(c.slug)}">${esc(c.name)}</a></li>`).join('')}<li><a href="/offers">العروض</a></li></ul></div>
      <div><h4>خدمة العملاء</h4><ul><li><a href="/track">تتبع الطلب</a></li><li><a href="/account">طلباتي</a></li><li><a href="/policies/shipping">الشحن والاسترجاع</a></li><li><a href="/policies/privacy">سياسة الخصوصية</a></li><li><a href="/policies/terms">الشروط والأحكام</a></li></ul></div>
      <div><h4>تواصل معنا</h4><ul><li dir="ltr" style="text-align:right"><a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></li><li><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></li><li>${esc(s.address)}</li><li>${esc(s.working_hours)}</li></ul></div>
    </div><div class="footer-bottom"><span>© ${new Date().getFullYear()} ${esc(s.company_name)}. جميع الحقوق محفوظة.</span><span class="pay-icons"><span>الدفع عند الاستلام</span><span>فودافون كاش</span><span>إنستاباي</span></span></div></div>`;
  }

  function bindHeader() {
    const toggle = (open) => { document.body.classList.toggle('drawer-open', open); $('#menuBtn').setAttribute('aria-expanded', String(open)); };
    $('#menuBtn').addEventListener('click', () => toggle(!document.body.classList.contains('drawer-open')));
    $('#drawerBackdrop').addEventListener('click', () => toggle(false));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggle(false); });
    $('#searchBtn').addEventListener('click', () => { const b = $('#searchBar'); b.classList.toggle('open'); if (b.classList.contains('open')) $('input', b).focus(); });
    $('#searchBar form').addEventListener('submit', (e) => { e.preventDefault(); const q = e.target.q.value.trim(); navigate(`/products${q ? `?q=${encodeURIComponent(q)}` : ''}`); });
  }

  async function boot() {
    bindHeader();
    updateCartBadge();
    try {
      state.boot = await api('/api/bootstrap');
      state.customer = state.boot.customer;
    } catch (e) {
      app.innerHTML = `<div class="container page"><div class="empty"><h2>تعذّر الاتصال بالمتجر</h2><p>تحقق من الاتصال بالإنترنت ثم أعد المحاولة.</p><a class="btn btn-dark" href="/" target="_self" data-hard>إعادة المحاولة</a></div></div>`;
      return;
    }
    renderChrome();
    initAnalytics(state.boot.settings);
    render();
  }
  window.addEventListener('storage', (e) => { if (e.key === CART_KEY) updateCartBadge(); });
  boot();
})();
